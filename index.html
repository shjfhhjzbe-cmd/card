<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="一封写给你的祝福。">
<title>一封祝福</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#efe9de;color:#263e34;font-family:"Songti SC","Noto Serif CJK SC",serif}.card{width:min(100%,440px);padding:clamp(24px,7vw,52px);border:1px solid #d3c3a7;background:#fffaf1;box-shadow:0 18px 65px #45321a16;text-align:center}.cover{display:block;margin:0 auto 25px;width:min(100%,240px);height:auto;border-radius:3px}.music{display:block;margin:18px auto 0;width:100%;max-width:300px}h1{font-size:clamp(26px,7vw,38px);font-weight:500;margin:0 0 24px}details{line-height:1.95}summary{cursor:pointer;list-style:none;background:#263e34;color:#fffaf1;padding:10px 24px;width:fit-content;margin:auto;border-radius:32px}summary::-webkit-details-marker{display:none}summary:focus-visible{outline:3px solid #b57a34;outline-offset:4px}details[open] .open,details:not([open]) .close{display:none}.letter{margin:24px 0 0;padding-top:20px;border-top:1px solid #dfd2be}.letter p{margin:0 0 12px}.letter p:last-child{margin-bottom:0}
</style>
<main class="card">
<img class="cover" src="cover.svg" width="480" height="375" alt="墨绿色封面，中间是一颗金色星星">
<h1>一封写给你的祝福</h1>
<details><summary><span class="open">打开贺卡</span><span class="close">合上贺卡</span></summary>
<div class="letter"><p>愿你在忙碌的日子里，也有时间做自己喜欢的事。</p><p>愿每一次出发都有期待，每一次回家都有好心情。</p><p>祝你今天开心，也祝你往后的日子顺心。</p><audio class="music" controls preload="none" src="music.wav" aria-label="贺卡配乐">你的浏览器不支持音频播放。</audio></div>
</details>
</main>
</html>
