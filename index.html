<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c122b">
<meta name="description" content="ly，生日快乐。">
<title>ly，生日快乐</title>
<style>
:root {
  color-scheme:dark;
  --ink:#170f25; --paper:#f8eefc; --muted:#dfd2eb; --gold:#f7d867; --cream:#fff1ae;
  --lilac:#bd96f0; --line:#bc9dd13e; --ease:cubic-bezier(.22,.72,.25,1);
  --serif:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
html { min-width:280px; }
body {
  margin:0; color:var(--paper);
  font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 12% 12%,#3a2450,transparent 53%),
    radial-gradient(ellipse at 91% 61%,#2e1d46,transparent 62%),var(--ink);
}
button,input { font:inherit; }
button { color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button:focus-visible,input:focus-visible { outline:2px solid var(--cream); outline-offset:5px; }
.defs { position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
.shell {
  width:min(100%,1270px); min-height:100vh; min-height:100svh; margin-inline:auto;
  display:flex; flex-direction:column;
  padding:max(13px,env(safe-area-inset-top)) clamp(17px,4.7vw,60px) max(19px,env(safe-area-inset-bottom));
}
.masthead {
  min-height:53px; padding-bottom:8px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.brand { display:flex; align-items:center; gap:9px; white-space:nowrap; font:400 17px/1.15 var(--serif); letter-spacing:.12em; }
.brand svg { width:23px; height:23px; color:var(--gold); }
.header-tools,.sound { display:flex; align-items:center; gap:12px; }
.steps { list-style:none; display:flex; gap:5px; padding:0; margin:0; }
.steps li { width:10px; height:2px; background:#bea0d398; border-radius:4px; transition:width .35s var(--ease); }
.steps li[aria-current="step"] { width:22px; background:var(--gold); }
.sound { gap:8px; }
.sound input { width:clamp(40px,10vw,108px); height:26px; accent-color:#f7d867; margin:0; cursor:pointer; }
.icon-button {
  border:1px solid #bba0d372; background:#382349; display:grid; place-items:center;
  width:42px; height:42px; border-radius:50%; padding:0; color:var(--cream);
}
.icon-button:hover { border-color:var(--gold); background:#4a3160; }
.icon-button svg { width:18px; height:18px; fill:currentColor; }
.notice { margin:7px 0 0; font-size:.875rem; color:#ffeba6; }
main { flex:1; display:grid; align-items:center; }
.page { padding-top:clamp(14px,3.3vh,38px); }
.page.entering { animation:page-enter .65s var(--ease) both; }
@keyframes page-enter { from { opacity:0; transform:translateY(9px) scale(.99); } }
.spread {
  display:grid; grid-template-columns:minmax(228px,.78fr) minmax(0,1.22fr);
  gap:clamp(24px,5.35vw,79px); align-items:center;
}
.copy { min-width:0; }
.eyebrow {
  margin:0 0 15px; display:flex; align-items:center; gap:11px;
  color:var(--cream); font-size:.875rem; letter-spacing:.12em;
}
.eyebrow::before { content:""; width:23px; height:1px; background:var(--gold); }
.copy h1,.copy h2 {
  margin:0; font:400 clamp(39px,5vw,74px)/1.12 var(--serif);
  letter-spacing:.035em;
}
.copy h1:focus,.copy h2:focus { outline:none; }
.copy em { display:block; color:var(--gold); font-style:normal; }
.description { color:var(--muted); margin:clamp(12px,2.7vh,26px) 0 0; max-width:25em; line-height:1.65; font-size:clamp(1rem,1.34vw,1.19rem); }
.count { display:block; margin:13px 0 0; color:var(--cream); font-size:.92rem; }
.last-wish {
  margin:16px 0 0; border-left:1px solid var(--gold); padding:2px 0 2px 13px;
  color:var(--cream); font:400 clamp(17px,1.7vw,24px)/1.6 var(--serif);
  animation:page-enter .55s var(--ease) both;
}
.pane {
  position:relative; isolation:isolate; overflow:hidden; width:min(100%,690px); justify-self:center;
  aspect-ratio:640/515; border:1px solid #b996da62; border-radius:9px;
  background:radial-gradient(ellipse at 59% 34%,#594079,transparent 69%),#291a3c;
  box-shadow:0 23px 64px #10081e60,inset 0 1px #efc6ff17;
}
.pane::before {
  content:""; position:absolute; z-index:4; inset:clamp(7px,1.4vw,16px);
  pointer-events:none; border:1px solid #e4c3f836; border-radius:5px;
}
.pane::after {
  content:""; position:absolute; z-index:-1; inset:0; pointer-events:none;
  background:repeating-linear-gradient(132deg,transparent 0 4px,#f8e9ff07 4px 5px);
  mask-image:radial-gradient(ellipse at 45% 42%,#000,transparent 88%);
}
.art { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.art .orbit { fill:none; stroke:#f4d780; stroke-width:1.15; }
.hero { --cover-time:1.24s; --cover-ease:cubic-bezier(.4,0,.2,1); }
.seal-overlay { z-index:2; }
.hero.opened .seal-overlay { visibility:hidden; }
.cover-seal {
  transform-origin:320px 234px; transform:scale(.72);
  filter:drop-shadow(0 0 17px #ffd66e88);
}
.cover-flare { opacity:0; transform-origin:320px 234px; }
.hero.opening .cover-seal { animation:release-seal var(--cover-time) ease-in-out both; }
.hero.opening .cover-flare { animation:seal-flare var(--cover-time) ease-out both; }
/* 星芒、柔光和照片共用同一条时间线，从同一个中心向外展开。 */
@keyframes release-seal {
  from { opacity:1; transform:scale(.72); }
  11% { opacity:1; transform:scale(.70); }
  26% { opacity:.77; transform:scale(.89); }
  60%,to { opacity:0; transform:scale(1.32); }
}
@keyframes seal-flare {
  from { opacity:0; transform:scale(.28); }
  32% { opacity:.92; transform:scale(.82); }
  to { opacity:0; transform:scale(1.67); }
}
.hero .burst-track { opacity:0; transform-origin:320px 234px; }
.hero.opening .burst-track { animation:opening-orbit var(--cover-time) ease-out both; }
.hero.opened .burst-track { opacity:.26; transform:scale(1.24) rotate(9deg); }
@keyframes opening-orbit {
  from { opacity:0; transform:scale(.63) rotate(-4deg); }
  38% { opacity:.65; }
  to { opacity:.26; transform:scale(1.24) rotate(9deg); }
}
/* 展开层的中心对齐 SVG 中 y=234 的主星，柔光覆盖照片淡入的边缘。 */
.photo-reveal { position:absolute; z-index:1; inset:0 0 9.13%; visibility:hidden; }
.hero.opening .photo-reveal,.hero.opened .photo-reveal { visibility:visible; }
.hero.opening .photo-reveal {
  --soft-aperture:radial-gradient(ellipse closest-side,#000 64%,transparent);
  -webkit-mask-image:var(--soft-aperture);
  mask-image:var(--soft-aperture);
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  animation:open-aperture var(--cover-time) var(--cover-ease) both;
}
@keyframes open-aperture {
  from,17% { -webkit-mask-size:25% 25%; mask-size:25% 25%; }
  to { -webkit-mask-size:200% 200%; mask-size:200% 200%; }
}
.photo-mount {
  position:absolute; left:50%; top:50%; width:68%; margin:0; opacity:0;
  padding:clamp(6px,1.15vw,12px); transform:translate(-50%,-50%) rotate(-.4deg) scale(1.04);
  background:linear-gradient(140deg,#bd96d9 3%,#8263a7 59%,#583970);
  border:1px solid #f6d686; border-radius:5px;
  box-shadow:0 20px 54px #1d0b308b,0 0 31px #f9d85e45,0 0 0 4px #f5d57b44;
}
.photo-mount::before {
  content:""; position:absolute; z-index:-1; inset:5px -8px -10px 6px; transform:rotate(3.5deg);
  background:#452b5e; border:1px solid #f7d77676; border-radius:5px;
}
.photo-surface { position:relative; overflow:hidden; border-radius:2px; aspect-ratio:993/623; background:#39264c; isolation:isolate; }
.photo-surface img { display:block; width:100%; height:100%; object-fit:contain; }
.hero.opening .photo-mount { animation:unveil-photo var(--cover-time) var(--cover-ease) both; }
.hero.opened .photo-mount { opacity:1; }
@keyframes unveil-photo {
  from,22% { opacity:0; transform:translate(-50%,-50%) rotate(-.4deg) scale(.81); }
  77% { opacity:1; }
  to { opacity:1; transform:translate(-50%,-50%) rotate(-.4deg) scale(1.04); }
}
.art-hit { position:absolute; z-index:3; inset:0; background:transparent; border:0; padding:0; border-radius:5px; }
.art-hit:focus-visible { outline-offset:-7px; }
.open-card { transition:opacity .24s ease-out; }
.open-card:disabled { opacity:0; pointer-events:none; }
.hit-label {
  display:inline-flex; align-items:center; gap:8px; position:absolute; left:50%; bottom:9%;
  transform:translateX(-50%); min-height:42px; padding:7px 17px;
  white-space:nowrap; border:1px solid #f9da85ad; border-radius:5px;
  background:#382551f0; color:var(--cream); letter-spacing:.05em; font-size:.9rem;
  animation:soft-hint 3.65s ease-in-out infinite;
}
.hit-label svg { width:15px; height:15px; color:var(--gold); }
.art-hit:hover .hit-label { background:#4f356b; border-color:var(--cream); }
@keyframes soft-hint {
  0%,100% { box-shadow:0 0 0 1px #f3d77518,0 0 8px #f9cf5444; }
  49% { box-shadow:0 0 0 2px #f3d77546,0 0 24px #f9cf5480; }
}
.page.urgent .hit-label { animation-duration:2.2s; border-color:var(--cream); }
.gallery-stage { background:radial-gradient(ellipse at 48% 42%,#5a3e83,transparent 64%),#271839; }
.balloon {
  position:absolute; z-index:2; left:var(--x); top:var(--y); width:var(--size); aspect-ratio:100/112;
  border:0; padding:0; background:none; border-radius:48%; transform:translate(-50%,-50%);
}
.balloon > svg {
  width:100%; height:auto; display:block; position:absolute; top:0; left:0; overflow:visible; pointer-events:none;
}
.balloon-float {
  transform-origin:50px 58px; animation:float 5.8s ease-in-out var(--float-delay) infinite;
}
@keyframes float {
  0%,100% { transform:translateY(2px) rotate(-2deg); }
  54% { transform:translateY(-3px) rotate(2deg); }
}
.balloon-light { opacity:.12; }
.balloon:not(.seen) .balloon-light { animation:balloon-light 5.65s ease-in-out var(--hint-delay) infinite both; }
@keyframes balloon-light {
  0%,19%,100% { opacity:.13; }
  8% { opacity:1; }
  13% { opacity:.62; }
}
.page.urgent .balloon:not(.seen) .balloon-light {
  animation:balloon-urgent var(--hint-cycle,4s) ease-in-out var(--urgent-delay) infinite both;
  filter:drop-shadow(0 0 5px #fff0a7);
}
@keyframes balloon-urgent { 0%,21%,100% { opacity:.2; } 10% { opacity:1; } }
.page .balloon:focus-visible .balloon-light { animation:none; opacity:1; }
@media (hover:hover) {
  .page .balloon:hover .balloon-light { animation:none; opacity:.88; }
}
.seen-mark {
  display:none; position:absolute; right:1%; top:12%; width:20px; height:20px; padding:4px;
  border:1px solid #f6d786; border-radius:50%; color:var(--cream); background:#36234d; pointer-events:none;
}
.seen .seen-mark { display:block; }
.seen-mark svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; }
.closing-stage {
  background:radial-gradient(ellipse at 50% 48%,#60457f 0%,#382352 55%,#28183c 96%);
}
.starfield { position:absolute; inset:0; width:100%; height:100%; z-index:1; opacity:0; pointer-events:none; }
.closing-stage.lighting .starfield,.closing-stage.lit .starfield { opacity:1; }
.closing-crest { z-index:2; }
.closing-star { transform-origin:320px 234px; }
.closing-stage.lighting .closing-star,.closing-stage.lit .closing-star { filter:drop-shadow(0 0 25px #ffdb77c7); }
.closing-stage.lighting .closing-star { animation:light-star 1.12s var(--ease) both; }
.closing-stage.lit .closing-star { animation:beating-star 5.8s ease-in-out infinite; }
@keyframes light-star {
  0% { transform:scale(.87) rotate(-5deg); }
  45% { transform:scale(1.19) rotate(3.6deg); }
  100% { transform:scale(1) rotate(0); }
}
@keyframes beating-star {
  0%,100% { transform:scale(1); }
  52% { transform:scale(1.035); }
}
.closing-rays { opacity:.33; transform-origin:320px 234px; }
.closing-stage.lighting .closing-rays { animation:reveal-rays 1.17s var(--ease) both; }
.closing-stage.lit .closing-rays { opacity:.89; }
.closing-trails { opacity:0; transform-origin:320px 234px; }
.closing-stage.lighting .closing-trails { animation:reveal-trails 1.14s var(--ease) both; }
.closing-stage.lit .closing-trails { opacity:.74; animation:turn-trails 37s linear infinite; }
@keyframes reveal-trails {
  from { opacity:0; transform:scale(.46) rotate(-20deg); }
  to { opacity:.74; transform:scale(1) rotate(0); }
}
@keyframes turn-trails {
  to { transform:rotate(360deg); }
}
@keyframes reveal-rays {
  0% { opacity:.33; transform:scale(.68); }
  59% { opacity:1; transform:scale(1.14); }
  100% { opacity:.89; transform:scale(1); }
}
.actions { min-height:54px; display:flex; justify-content:flex-end; align-items:end; margin-top:clamp(7px,2vh,18px); }
.next {
  min-height:46px; min-width:115px; padding:8px 18px; border-radius:5px; font-weight:600;
  background:linear-gradient(155deg,#fff1ad,#edc54e); color:#35264a; border:1px solid #ffe3a0;
  letter-spacing:.09em; animation:page-enter .42s var(--ease) both;
}
.next:hover { background:#fff0ab; }
.photo-dialog {
  position:fixed; width:min(calc(100% - 24px),818px); max-height:calc(100vh - 22px);
  max-height:calc(100dvh - 22px); overflow:auto; margin:auto; padding:11px;
  border:1px solid #c3a1e6; border-radius:8px; background:#302047; color:var(--paper);
  box-shadow:0 27px 95px #0c061caa;
}
.photo-dialog[open] { animation:page-enter .28s var(--ease) both; }
.photo-dialog::backdrop { background:#150d21dc; }
.photo-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 8px; padding-left:6px; }
.photo-top h2 { margin:0; font:400 17px/1.2 var(--serif); color:var(--cream); }
.photo-top .icon-button { width:44px; height:44px; }
.photo-top .icon-button svg { fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; }
.photo-view { display:grid; grid-template-columns:minmax(0,1fr); place-items:center; border-radius:4px; background:#21172e; min-height:64px; }
.photo-view img { display:block; max-width:100%; width:auto; height:auto; max-height:calc(100vh - 103px); max-height:calc(100dvh - 103px); object-fit:contain; }
.photo-caption { margin:20px; text-align:center; color:var(--muted); }
@media (max-width:760px) and (orientation:portrait) {
  .shell { padding-inline:clamp(16px,5.2vw,37px); }
  .spread { grid-template-columns:minmax(0,1fr); gap:15px; }
  .copy h1,.copy h2 { font-size:clamp(34px,9vw,57px); }
  .eyebrow { margin-bottom:7px; }
  .description { margin-top:8px; }
  .count { margin-top:6px; }
  .last-wish { margin-top:10px; }
  .actions { margin-top:12px; }
  .next { width:100%; min-height:48px; }
}
@media (max-width:375px) {
  .masthead { gap:8px; }
  .header-tools { gap:8px; }
  .brand { font-size:15px; letter-spacing:.05em; gap:6px; }
  .steps { gap:4px; }
  .steps li { width:7px; }
  .steps li[aria-current="step"] { width:15px; }
}
@media (orientation:landscape) and (max-height:560px) {
  .shell { padding-top:6px; padding-bottom:7px; }
  .masthead { min-height:44px; padding-bottom:4px; }
  .page { padding-top:8px; }
  .spread { grid-template-columns:minmax(130px,.84fr) minmax(0,1.16fr); gap:clamp(14px,4vw,39px); }
  .pane { width:min(100%,calc(100vh * .75)); width:min(100%,calc(100svh * .75)); }
  .copy h1,.copy h2 { font-size:clamp(28px,8vh,50px); }
  .eyebrow { margin-bottom:7px; }
  .description,.count,.last-wish { margin-top:7px; }
  .actions { min-height:45px; margin-top:6px; }
  .next { min-height:42px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; }
  .balloon:not(.seen) .balloon-light { opacity:.58; }
  .page.urgent .balloon:not(.seen) .balloon-light { opacity:.9; }
}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff2b5"/><stop offset=".49" stop-color="#d2a744"/><stop offset="1" stop-color="#ffdf78"/>
    </linearGradient>
    <radialGradient id="balloon-gold" cx=".34" cy=".25" r=".78">
      <stop stop-color="#fff3b2"/><stop offset=".49" stop-color="#f2ce61"/><stop offset="1" stop-color="#a97439"/>
    </radialGradient>
    <radialGradient id="balloon-lilac" cx=".34" cy=".23" r=".8">
      <stop stop-color="#ead7ff"/><stop offset=".53" stop-color="#b88de2"/><stop offset="1" stop-color="#715399"/>
    </radialGradient>
    <radialGradient id="balloon-violet" cx=".35" cy=".25" r=".79">
      <stop stop-color="#dfc5ff"/><stop offset=".5" stop-color="#a47adc"/><stop offset="1" stop-color="#644583"/>
    </radialGradient>
    <radialGradient id="balloon-glow" cx=".34" cy=".27" r=".78">
      <stop stop-color="#fff5be" stop-opacity=".79"/><stop offset=".46" stop-color="#ffdc87" stop-opacity=".35"/><stop offset="1" stop-color="#ffe4a1" stop-opacity=".07"/>
    </radialGradient>
    <radialGradient id="star-haze">
      <stop stop-color="#ffd55c" stop-opacity=".47"/><stop offset=".56" stop-color="#f3c652" stop-opacity=".13"/><stop offset="1" stop-color="#f3c652" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cover-light">
      <stop stop-color="#fff6cf" stop-opacity=".94"/>
      <stop offset=".24" stop-color="#ffdd94" stop-opacity=".66"/>
      <stop offset=".63" stop-color="#ffe0a0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d3a3fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star-metal" x1="0" y1="0" x2=".87" y2="1">
      <stop stop-color="#fff9c7"/><stop offset=".41" stop-color="#f6d35e"/><stop offset="1" stop-color="#b78239"/>
    </linearGradient>
    <path id="spark" d="M0-12Q1-1 12 0 1 1 0 12-1 1-12 0-1-1 0-12Z" fill="currentColor"/>
    <g id="wish-star">
      <path d="m320 87 32 94 85 53-85 38-32 98-37-98-85-38 85-53Z" fill="url(#star-metal)" stroke="#fff0b3" stroke-width="1.5"/>
      <path d="m320 87 4 141 113 6-85-53ZM320 370l4-142 113 6-85 38Z" fill="#9f6b43" opacity=".37"/>
      <path d="m320 87 4 141-126 6 85-53Zm0 283 4-142-126 6 85 38Z" fill="#fff4b9" opacity=".35"/>
      <path d="m320 87 4 141 113 6M198 234l126-6-4 142" fill="none" stroke="#fff5c0" stroke-opacity=".64" stroke-width="1.25"/>
      <circle cx="324" cy="228" r="3.1" fill="#fff6c5"/>
    </g>
    <path id="balloon-shape" d="M50 5C24 5 7 24 7 49c0 31 20 53 43 57 23-4 43-26 43-57C93 24 76 5 50 5Z"/>
  </defs>
</svg>

<div class="shell">
  <header class="masthead">
    <div class="brand">
      <svg viewBox="-15 -15 30 30" aria-hidden="true"><use href="#spark"/></svg>
      生日贺卡
    </div>
    <div class="header-tools">
      <ol class="steps" aria-label="贺卡进度">
        <li aria-label="开场" aria-current="step"></li><li aria-label="气球相册"></li><li aria-label="生日祝福"></li>
      </ol>
      <div class="sound" hidden>
        <input type="range" id="seek" min="0" max="1" value="0" step=".05" aria-label="录音进度" disabled>
        <button id="sound-toggle" type="button" class="icon-button" aria-label="播放录音">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="play-icon" d="M8 5.5Q7 5 7 6v12q0 1 1 .5l11-6q.75-.5 0-1Z"/>
            <path class="pause-icon" d="M7 5h3.6v14H7zm6.4 0H17v14h-3.6z" hidden/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <p class="notice" role="status" hidden></p>

  <main aria-label="送给 ly 的生日贺卡">
    <section class="page" aria-labelledby="welcome-title">
      <div class="spread">
        <div class="copy">
          <p class="eyebrow">给 ly 的一封祝福</p>
          <h1 id="welcome-title" tabindex="-1">ly，<em>生日快乐！</em></h1>
          <p class="description">把今天的快乐，装进这封贺卡里。</p>
        </div>
        <div class="pane hero">
          <svg class="art" viewBox="0 0 640 515" aria-hidden="true">
            <ellipse cx="326" cy="252" rx="240" ry="187" fill="url(#star-haze)" opacity=".52"/>
            <path class="orbit" d="M84 298C67 216 188 125 359 118c123-5 205 32 199 90-5 52-109 130-222 158-125 31-236 4-252-68Z" opacity=".47"/>

              <path d="M63 231C85 128 217 62 328 71c69 6 146 40 203 106M91 353c67 96 231 101 388 22" stroke="#f3bc6d" stroke-opacity=".51"/>
              <use href="#spark" transform="translate(101 246) scale(.54)"/>

    <img alt="" hidden>
    <p class="photo-caption" role="status" hidden></p>
  </div>
</dialog>
<audio id="recording" src="./11.mp3" preload="none"></audio>

<script>
(() => {
  'use strict';
  const one = (selector, root = document) => root.querySelector(selector);
  const pages = Array.from(document.querySelectorAll('.page'));
  const steps = Array.from(document.querySelectorAll('.steps li'));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const openButton = one('.open-card');
  const starButton = one('.light-star');
  const hero = one('.hero');
  const coverFrame = one('.photo-mount',hero);
  const coverImage = one('img',coverFrame);
  const closing = one('.closing-stage');
  const wish = one('.last-wish');
  const gallery = one('.gallery-stage');
  const count = one('.count');
  const photoDialog = one('.photo-dialog');
  const photo = one('img',photoDialog);
  const photoTitle = one('#photo-title');
  const caption = one('.photo-caption',photoDialog);
  const audio = one('#recording');
  const sound = one('.sound');
  const soundButton = one('#sound-toggle');
  const playIcon = one('.play-icon',soundButton);
  const pauseIcon = one('.pause-icon',soundButton);
  const seek = one('#seek');
  const notice = one('.notice');
  const starfield = one('.starfield',closing);
  const sky = starfield.getContext('2d');

  // 按素材文件名顺序分配，从左到右对应五只气球。
  const photos = [
    ['balloon-01.jpg',17,53,21,'violet'],
    ['balloon-02.jpg',33,33,18,'gold'],
    ['balloon-03.jpg',50,54,26,'lilac'],
    ['balloon-04.jpg',68,34,18,'violet'],
    ['balloon-05.jpg',83,53,21,'gold']
  ];
  const seen = new Set();
  let currentPage = 0;
  let urgentTimer = 0;
  let openedPhoto = null;
  let photoRequest = 0;
  let soundAttempt = 0;
  let scrubbing = false;
  let skyFrame = 0;
  let skyTime = 0;
  let lastSkyFrame = 0;

  // 不同倾角的椭圆轨道让星尘绕过中央主星，明亮的星粒带着渐隐尾迹。
  const orbits = [
    [206,63,-19,.61], [235,99,24,-.37], [190,113,-34,.46], [249,53,9,-.53]
  ].map(([rx,ry,tilt,speed],index) => {
    const angle = tilt * Math.PI / 180;
    return {rx,ry,speed,cos:Math.cos(angle),sin:Math.sin(angle),phase:.44 + index * 1.58,tone:index % 2};
  });
  const stardust = orbits.flatMap((orbit,band) => Array.from({length:12},(_,i) => ({
    orbit, phase:i * Math.PI / 6 + band * .37 + Math.random() * .31,
    spread:.93 + Math.random() * .21, shimmer:Math.random() * Math.PI * 2,
    speed:orbit.speed * (.44 + Math.random() * .46), size:8 + Math.random() * 10
  })));
  const distantStars = Array.from({length:32},(_,i) => ({
    x:52 + Math.random() * 536,y:51 + Math.random() * 396,
    size:5 + Math.random() * 10,phase:Math.random() * Math.PI * 2,tone:i % 2
  }));
  const starInk = ['#ffe19b','#dac0ff'];
  const starSprites = sky ? [makeStarSprite('255,213,129'),makeStarSprite('208,161,255')] : [];

  function makeStarSprite(rgb) {
    const sample = document.createElement('canvas');
    sample.width = sample.height = 48;
    const pen = sample.getContext('2d');
    const glow = pen.createRadialGradient(24,24,0,24,24,24);
    glow.addColorStop(0,'rgba(255,248,222,1)');
    glow.addColorStop(.19,'rgba(' + rgb + ',.92)');
    glow.addColorStop(.42,'rgba(' + rgb + ',.26)');
    glow.addColorStop(1,'rgba(' + rgb + ',0)');
    pen.fillStyle = glow;
    pen.fillRect(0,0,48,48);
    pen.fillStyle = 'rgba(255,247,219,.85)';
    pen.beginPath();
    pen.moveTo(24,12); pen.quadraticCurveTo(25,23,36,24);
    pen.quadraticCurveTo(25,25,24,36); pen.quadraticCurveTo(23,25,12,24);
    pen.quadraticCurveTo(23,23,24,12); pen.fill();
    return sample;
  }

  function sizeSky() {
    const density = Math.min(1.6,window.devicePixelRatio || 1);
    const width = Math.max(1,Math.round(starfield.clientWidth * density));
    const height = Math.max(1,Math.round(starfield.clientHeight * density));
    if (starfield.width !== width || starfield.height !== height) {
      starfield.width = width;
      starfield.height = height;
    }
    sky.setTransform(width / 640,0,0,height / 515,0,0);
  }

  function orbitPoint(orbit,angle,spread) {
    const x = Math.cos(angle) * orbit.rx * spread;
    const y = Math.sin(angle) * orbit.ry * spread;
    return [320 + x * orbit.cos - y * orbit.sin,234 + x * orbit.sin + y * orbit.cos];
  }

  function paintStar(tone,x,y,size,opacity) {
    sky.globalAlpha = opacity;
    sky.drawImage(starSprites[tone],x - size / 2,y - size / 2,size,size);
  }

  function paintSky(time) {
    sky.clearRect(0,0,640,515);
    sky.globalCompositeOperation = 'lighter';
    const reveal = 1 - Math.exp(-time * 3.6);
    const spread = .66 + reveal * .34;
    distantStars.forEach(star => {
      const shimmer = .57 + Math.sin(time * 1.46 + star.phase) * .24;
      paintStar(star.tone,star.x + Math.sin(time * .31 + star.phase) * 14,
        star.y + Math.cos(time * .4 + star.phase) * 11,star.size,shimmer * reveal);
    });
    stardust.forEach(star => {
      const [x,y] = orbitPoint(star.orbit,star.phase + star.speed * time,star.spread * spread);
      const shimmer = .42 + Math.sin(time * 2.15 + star.shimmer) * .22;
      paintStar(star.orbit.tone,x,y,star.size,reveal * shimmer);
    });
    orbits.forEach(orbit => {
      const phase = orbit.phase + time * orbit.speed;
      const [x,y] = orbitPoint(orbit,phase,spread);
      let lastX = x, lastY = y;
      sky.strokeStyle = starInk[orbit.tone];
      sky.lineCap = 'round';
      for (let i = 1; i <= 14; i++) {
        const [tailX,tailY] = orbitPoint(orbit,phase - Math.sign(orbit.speed) * i * .049,spread);
        sky.globalAlpha = (1 - i / 15) ** 1.6 * reveal * .78;
        sky.lineWidth = 2.2 - i * .116;
        sky.beginPath(); sky.moveTo(lastX,lastY); sky.lineTo(tailX,tailY); sky.stroke();
        lastX = tailX; lastY = tailY;
      }
      paintStar(orbit.tone,x,y,32 + Math.sin(time * 3 + orbit.phase) * 4,reveal);
    });
    sky.globalAlpha = 1;
    sky.globalCompositeOperation = 'source-over';
  }

  function drawSky(now) {
    if (lastSkyFrame) skyTime += Math.min(.055,(now - lastSkyFrame) / 1000);
    lastSkyFrame = now;
    paintSky(skyTime);
    skyFrame = window.requestAnimationFrame(drawSky);
  }

  function syncSky() {
    window.cancelAnimationFrame(skyFrame);
    skyFrame = 0;
    lastSkyFrame = 0;
    if (!sky || currentPage !== 2 || document.hidden || !closing.matches('.lighting,.lit')) return;
    sizeSky();
    if (reduce.matches) paintSky(3.1);
    else skyFrame = window.requestAnimationFrame(drawSky);
  }

  const balloons = photos.map(([,x,y,size,color],index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'balloon';
    button.setAttribute('aria-label','打开第 ' + (index + 1) + ' 张照片');
    button.setAttribute('aria-haspopup','dialog');
    button.style.setProperty('--x',x + '%');
    button.style.setProperty('--y',y + '%');
    button.style.setProperty('--size',size + '%');
    button.style.setProperty('--float-delay',(-index * .83) + 's');
    button.style.setProperty('--hint-delay',(index * 1.13) + 's');
    button.innerHTML = `
      <svg viewBox="0 0 100 158" aria-hidden="true">
        <g class="balloon-float">
          <path d="M50 107c-7 13 6 19 6 28 0 9-7 11-5 20" fill="none" stroke="#f8d683" stroke-width="1.1" opacity=".82"/>
          <path d="m50 101 6 10H44Z" fill="url(#gold-stroke)"/>
          <use href="#balloon-shape" fill="url(#balloon-${color})" stroke="#fff0bd" stroke-opacity=".64" stroke-width="1.15"/>
          <path d="M19 38c3-13 11-21 22-23m27 77c11-6 16-13 19-22" fill="none" stroke="#fff3d8" stroke-width="1.6" stroke-linecap="round" opacity=".64"/>
          <g class="balloon-light" color="#fff7cb">
            <use href="#balloon-shape" fill="url(#balloon-glow)" stroke="#ffe897" stroke-width="2.5"/>
            <use href="#spark" transform="translate(34 31) scale(.9)"/>
            <use href="#spark" transform="translate(84 22) scale(.52)"/>
          </g>
        </g>
      </svg>
      <span class="seen-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></span>`;
    button.addEventListener('click',() => showPhoto(index));
    gallery.append(button);
    return button;
  });

  function invite() {
    window.clearTimeout(urgentTimer);
    const page = pages[currentPage];
    if (!one('.next',page).hidden) return;
    urgentTimer = window.setTimeout(() => {
      if (page === pages[currentPage] && one('.next',page).hidden) page.classList.add('urgent');
    },3600);
  }

  function unlock(index) {
    window.clearTimeout(urgentTimer);
    const page = pages[index];
    page.classList.remove('urgent');
    one('.next',page).hidden = false;
  }

  function showPage(index) {
    currentPage = index;
    pages.forEach((page,i) => {
      page.hidden = i !== index;
      page.classList.toggle('entering',i === index);
      page.classList.remove('urgent');
      steps[i].toggleAttribute('aria-current',i === index);
      if (i === index) steps[i].setAttribute('aria-current','step');
    });
    window.scrollTo(0,0);
    one('h1,h2',pages[index]).focus({preventScroll:true});
    invite();
    syncSky();
  }

  function showPhoto(index) {
    if (currentPage !== 1 || photoDialog.open || openedPhoto !== null) return;
    const request = ++photoRequest;
    openedPhoto = index;
    photo.hidden = true;
    photo.removeAttribute('src');
    photo.alt = '相册照片 ' + (index + 1);
    photoTitle.textContent = '照片 ' + (index + 1) + ' / ' + photos.length;
    caption.hidden = false;
    caption.textContent = '照片加载中…';
    photoDialog.showModal();
    const loader = new Image();
    loader.onload = () => {
      if (request !== photoRequest) return;
      photo.src = loader.src;
      photo.hidden = false;
      caption.hidden = true;
    };
    loader.onerror = () => {
      if (request === photoRequest) caption.textContent = '这张照片暂时无法加载。';
    };
    loader.src = './' + photos[index][0];
  }

  function updateGallery() {
    let pending = 0;
    balloons.forEach((button,index) => {
      const visited = seen.has(index);
      button.classList.toggle('seen',visited);
      button.setAttribute('aria-label',(visited ? '重看第 ' : '打开第 ') + (index + 1) + ' 张照片');
      if (!visited) button.style.setProperty('--urgent-delay',(pending++ * .79) + 's');
    });
    gallery.style.setProperty('--hint-cycle',Math.max(1.8,pending * .79) + 's');
    count.textContent = '已点开 ' + seen.size + ' / ' + photos.length + ' 张';
    if (seen.size === photos.length) unlock(1);
  }

  photoDialog.addEventListener('close',() => {
    photoRequest++;
    photo.hidden = true;
    photo.removeAttribute('src');
    if (openedPhoto === null) return;
    const index = openedPhoto;
    openedPhoto = null;
    seen.add(index);
    updateGallery();
    balloons[index].focus({preventScroll:true});
  });

  function showAudioStatus(message) {
    notice.textContent = message;
    notice.hidden = false;
  }

  function playSound() {
    const attempt = ++soundAttempt;
    notice.hidden = true;
    if (audio.ended) audio.currentTime = 0;
    const result = audio.play();
    if (result) result.catch(error => {
      if (attempt !== soundAttempt || error.name === 'AbortError') return;
      showAudioStatus(audio.error ? '录音暂时无法播放，请确认 11.mp3 与网页在同一目录。' : '请点右上角的播放按钮继续听录音。');
    });
  }

  function paintSound() {
    const playing = !audio.paused && !audio.ended;
    soundButton.setAttribute('aria-label',playing ? '暂停录音' : '播放录音');
    playIcon.toggleAttribute('hidden',playing);
    pauseIcon.toggleAttribute('hidden',!playing);
  }

  function timeLabel(seconds) {
    const time = Math.max(0,Math.floor(seconds || 0));
    return Math.floor(time / 60) + ':' + String(time % 60).padStart(2,'0');
  }

  function paintSeek() {
    const ready = Number.isFinite(audio.duration) && audio.duration > 0;
    seek.disabled = !ready;
    seek.max = ready ? audio.duration : 1;
    if (!scrubbing) seek.value = audio.currentTime;
    seek.setAttribute('aria-valuetext',timeLabel(audio.currentTime) + ' / ' + timeLabel(ready ? audio.duration : 0));
  }

  soundButton.addEventListener('click',() => {
    if (audio.paused || audio.ended) playSound();
    else {
      soundAttempt++;
      audio.pause();
      paintSound();
    }
  });
  seek.addEventListener('pointerdown',() => { scrubbing = true; });
  window.addEventListener('pointerup',() => { scrubbing = false; });
  window.addEventListener('pointercancel',() => { scrubbing = false; });
  seek.addEventListener('blur',() => { scrubbing = false; });
  seek.addEventListener('input',() => { audio.currentTime = Number(seek.value); paintSeek(); });
  ['play','pause','ended','error'].forEach(event => audio.addEventListener(event,paintSound));
  ['loadedmetadata','durationchange','timeupdate','seeked'].forEach(event => audio.addEventListener(event,paintSeek));

  function finishCover() {
    if (!hero.classList.replace('opening','opened')) return;
    openButton.hidden = true;
    unlock(0);
    one('.next',pages[0]).focus({preventScroll:true});
  }

  coverFrame.addEventListener('animationend',event => {
    if (event.animationName === 'unveil-photo') finishCover();
  });
  coverFrame.addEventListener('animationcancel',event => {
    if (event.animationName === 'unveil-photo' && reduce.matches) finishCover();
  });

  openButton.addEventListener('click',async () => {
    if (openButton.disabled) return;
    openButton.disabled = true;
    sound.hidden = false;
    playSound();
    // 录音随点击立即播放，照片准备好后再开始淡入，避免露出空白相框。
    if (coverImage.decode) await coverImage.decode().catch(() => {});
    hero.classList.add('opening');
    if (reduce.matches) finishCover();
  });

  starButton.addEventListener('click',() => {
    starButton.hidden = true;
    closing.classList.add('lighting');
    wish.hidden = false;
    skyTime = 0;
    syncSky();
    window.setTimeout(() => {
      closing.classList.replace('lighting','lit');
      unlock(2);
      one('.next',pages[2]).focus({preventScroll:true});
    },reduce.matches ? 0 : 1190);
  });

  pages.forEach((page,index) => {
    const next = one('.next',page);
    next.addEventListener('click',() => {
      if (next.hidden || currentPage !== index || photoDialog.open) return;
      if (index !== 2) { showPage(index + 1); return; }
      soundAttempt++;
      audio.pause();
      if (audio.readyState) audio.currentTime = 0;
      sound.hidden = true;
      notice.hidden = true;
      scrubbing = false;
      paintSound();
      paintSeek();
      hero.classList.remove('opened');
      closing.classList.remove('lit');
      openButton.hidden = false;
      openButton.disabled = false;
      starButton.hidden = false;
      wish.hidden = true;
      pages.forEach(item => { one('.next',item).hidden = true; });
      seen.clear();
      updateGallery();
      showPage(0);
    });
    page.addEventListener('click',event => {
      if (currentPage === index && next.hidden && !event.target.closest('button')) page.classList.add('urgent');
    });
  });

  window.addEventListener('resize',syncSky,{passive:true});
  document.addEventListener('visibilitychange',syncSky);
  if (reduce.addEventListener) reduce.addEventListener('change',syncSky);
  else reduce.addListener(syncSky);
  updateGallery();
  invite();
})();
</script>
</body>
</html>
